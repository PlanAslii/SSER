name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests || true
      - name: Test
        run: |
          export DATABASE_URL="sqlite:////tmp/planasli-test.db"
          export SECRET_KEY="test-secret-key-for-ci-only"
          pytest tests/ -q --tb=short || true

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${VERSION}" > VERSION
          ARCHIVE="planasli-ssh-${VERSION}.tar.gz"
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' \
              --exclude='*.pyc' --exclude='.venv' --exclude='venv' \
              --exclude='artifacts' --exclude='*.db' \
              -czf "/tmp/${ARCHIVE}" .
          sha256sum "/tmp/${ARCHIVE}" | awk '{print $1}' > "/tmp/${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          cp "/tmp/${ARCHIVE}" .
          cp "/tmp/${ARCHIVE}.sha256" .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
