<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}" data-theme="{{ theme if theme != 'system' else '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app_name') }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function() {
      var t = localStorage.getItem('planasli-theme') || '{{ theme }}';
      if (t === 'system') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    {% include "partials/sidebar.html" %}
    <div class="main-content">
      {% include "partials/header.html" %}
      <main class="page-body">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
