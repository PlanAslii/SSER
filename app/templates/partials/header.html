<header class="header">
  <div class="header-left">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <h1 class="page-title">{% block page_title %}{{ t(page) if page else '' }}{% endblock %}</h1>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="themeToggle" title="Theme" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sun"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <form method="post" action="/settings/profile" style="display:inline">
      <select name="language" class="form-select" style="width:auto;padding:4px 8px;font-size:0.75rem" onchange="this.form.submit()">
        <option value="fa" {% if lang == 'fa' %}selected{% endif %}>فارسی</option>
        <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
      </select>
      <input type="hidden" name="theme" value="{{ theme }}">
      <input type="hidden" name="display_name" value="{{ admin.display_name or admin.username }}">
    </form>
    <div class="admin-menu">
      <a href="/settings" class="admin-menu-btn">
        <span>{{ admin.display_name or admin.username }}</span>
      </a>
      <a href="/logout" class="btn btn-ghost btn-sm" style="margin-inline-start:4px">{{ t('logout') }}</a>
    </div>
  </div>
</header>
