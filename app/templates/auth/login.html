<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login') }} — {{ t('app_name') }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">{{ t('app_name') }}</h1>
      <p class="auth-subtitle">{{ t('login') }}</p>
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="form-group">
          <label class="form-label" for="username">{{ t('username') }}</label>
          <input class="form-input" type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">{{ t('password') }}</label>
          <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">{{ t('login') }}</button>
      </form>
    </div>
  </div>
</body>
</html>
